# Affinage du détecteur après une correction du générateur d'images (data/hyp_route_fr.yaml avec un pas réduit) :
# le réseau part des poids déjà entraînés, on veut corriger un point sans défaire le reste.
#  - lr0 : 0.003 pour un premier passage de deux époques, puis 0.0015 pour deux époques de consolidation
#  - warmup_bias_lr au niveau de lr0 : pas de secousse au démarrage
lr0: 0.003
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 0.1
warmup_momentum: 0.8
warmup_bias_lr: 0.003
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.005
hsv_s: 0.5
hsv_v: 0.35
degrees: 2.0
translate: 0.1
scale: 0.4
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
